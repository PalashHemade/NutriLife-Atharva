apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nutrilife

resources:
  - namespace.yaml
  - configmap.yaml
  - ml-service.yaml
  - app.yaml
  # secret.yaml is intentionally NOT listed here - the real secret (with
  # your actual credentials) is created directly with `kubectl create
  # secret`, not applied from a committed file. See secret.example.yaml.
