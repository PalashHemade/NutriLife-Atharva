# Template only - do NOT put real secret values in this file or commit
# real values anywhere. Create the actual Secret one of two ways:
#
#   Option A (recommended - reuses your existing .env, nothing retyped):
#     kubectl create namespace nutrilife --dry-run=client -o yaml | kubectl apply -f -
#     kubectl create secret generic nutrilife-secrets \
#       --namespace nutrilife \
#       --from-literal=NEXTAUTH_SECRET=$(grep NEXTAUTH_SECRET .env | cut -d= -f2-) \
#       --from-literal=MONGODB_URI=$(grep MONGODB_URI .env | cut -d= -f2-) \
#       --from-literal=GROQ_API_KEY=$(grep GROQ_API_KEY .env | cut -d= -f2-)
#
#   Option B: copy this file to secret.yaml (already gitignored), fill in
#   real values, then `kubectl apply -f k8s/secret.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: nutrilife-secrets
  namespace: nutrilife
type: Opaque
stringData:
  NEXTAUTH_SECRET: "replace-with-a-random-secret"
  MONGODB_URI: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/nutrilife?retryWrites=true&w=majority"
  GROQ_API_KEY: "replace-with-your-groq-api-key"
