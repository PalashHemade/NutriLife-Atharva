apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: nutrilife
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: nutrilife-atharva-app:latest
          imagePullPolicy: Never # see note in ml-service.yaml
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: nutrilife-config
            - secretRef:
                name: nutrilife-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: nutrilife
spec:
  selector:
    app: app
  ports:
    - port: 3000
      targetPort: 3000
  # LoadBalancer exposes this on localhost automatically on Docker
  # Desktop's Kubernetes. On a cloud cluster this provisions a real
  # external load balancer; on a cluster without one, switch to NodePort
  # or put an Ingress in front instead.
  type: LoadBalancer
