apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: nutrilife
  labels:
    app: ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: nutrilife-atharva-ml-service:latest
          # Built locally with `docker build`, not pushed to any registry -
          # Never tells kubelet to use the image already in the local
          # Docker image store instead of trying (and failing) to pull it.
          # Works out of the box on Docker Desktop's built-in Kubernetes,
          # which shares that image store. On a real multi-node cluster
          # you'd push this image to a registry and switch to
          # imagePullPolicy: IfNotPresent (or Always) instead.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: nutrilife
spec:
  selector:
    app: ml-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
